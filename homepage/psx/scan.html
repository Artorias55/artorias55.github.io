<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PIXEL Scan</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      user-select: none;
      cursor: pointer;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
    }

    #stage {
      position: relative;
      width: min(100vw, 75vh);
      height: min(100vh, 133.333vw);
      background: #000;
      overflow: hidden;
    }

    .card {
      position: absolute;
      inset: 0;
      background: #000;
      overflow: hidden;
      transform-origin: 50% 50%;
      will-change: transform;
      backface-visibility: hidden;
    }

    .card video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
      pointer-events: none;
    }

    .preload-video {
      position: fixed;
      width: 1px;
      height: 1px;
      left: -9999px;
      top: -9999px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="stage">
      <div class="card" id="card0">
        <video id="video0" playsinline preload="auto" loop></video>
      </div>

      <div class="card" id="card1">
        <video id="video1" playsinline preload="auto" loop></video>
      </div>
    </div>
  </div>

  <script>
    const VIDEO_FILES = [
      "./01.mp4",
      "./02.mp4",
      "./03.mp4",
      "./04.mp4",
      "./05.mp4",
      "./06.mp4",
      "./07.mp4",
      "./08.mp4",
      "./09.mp4",
      "./10.mp4",
      "./11.mp4",
      "./12.mp4",
      "./13.mp4",
      "./14.mp4",
      "./15.mp4",
      "./16.mp4",
      "./17.mp4",
      "./18.mp4",
      "./19.mp4"
    ];

    const DISTANCE = 1.25;
    const ROTATE_MAX = 18;
    const SCALE_DROP = 0.04;
    const TRANSITION_DURATION = Math.round(550 / 0.7);

    const BGM_VOLUME = 0.25;
    const BGM_START_TIME = 142;

    // 当前视频前后各预加载几层
    const PRELOAD_LAYERS = 2;

    // 如果预加载还没完成，切换时最多等多久再开始动画
    const INCOMING_WAIT_TIMEOUT = 1200;

    const app = document.getElementById("app");

    const cards = [
      document.getElementById("card0"),
      document.getElementById("card1")
    ];

    const videos = [
      document.getElementById("video0"),
      document.getElementById("video1")
    ];

    const preloadVideos = new Map();

    let currentIndex = 0;
    let activeSlot = 0;
    let transitioning = false;

    let pointerDownX = 0;
    let pointerDownY = 0;
    let pointerIsDown = false;

    let firstInteractionDone = false;

    let audioCtx = null;
    let bgmBuffer = null;
    let bgmSource = null;
    let bgmGain = null;
    let bgmStarted = false;
    let bgmLoadingPromise = null;

    function ease(t) {
      return t * t * (3 - 2 * t);
    }

    function wrapIndex(index) {
      return (index + VIDEO_FILES.length) % VIDEO_FILES.length;
    }

    function applyTransform(slot, x, rot, scale) {
      cards[slot].style.transform =
        `translateX(${x * 100}%) rotate(${rot}deg) scale(${scale})`;
    }

    function hideSlot(slot) {
      applyTransform(slot, 3.0, 0, 1);
      cards[slot].style.zIndex = 0;

      videos[slot].muted = true;
      videos[slot].pause();
    }

    function showSlot(slot) {
      applyTransform(slot, 0, 0, 1);
      cards[slot].style.zIndex = 2;
    }

    function setVideoSource(slot, index) {
      const src = VIDEO_FILES[index];
      const video = videos[slot];

      video.loop = true;
      video.playsInline = true;
      video.preload = "auto";

      if (video.dataset.src !== src) {
        video.src = src;
        video.dataset.src = src;
        video.load();
      }
    }

    function preloadVideo(index) {
      if (VIDEO_FILES.length === 0) return;

      index = wrapIndex(index);
      const src = VIDEO_FILES[index];

      if (preloadVideos.has(src)) return;

      const video = document.createElement("video");

      video.src = src;
      video.preload = "auto";
      video.muted = true;
      video.loop = true;
      video.playsInline = true;
      video.className = "preload-video";

      video.setAttribute("playsinline", "");
      video.setAttribute("webkit-playsinline", "");

      document.body.appendChild(video);

      try {
        video.load();
      } catch (error) {}

      preloadVideos.set(src, video);
    }

    function preloadAround(index) {
      if (VIDEO_FILES.length === 0) return;

      for (let i = 1; i <= PRELOAD_LAYERS; i++) {
        preloadVideo(index + i);
        preloadVideo(index - i);
      }
    }

    function waitForVideoReady(video, timeout) {
      return new Promise(function (resolve) {
        if (video.readyState >= 2) {
          resolve();
          return;
        }

        let done = false;

        function finish() {
          if (done) return;
          done = true;

          video.removeEventListener("loadeddata", finish);
          video.removeEventListener("canplay", finish);
          video.removeEventListener("error", finish);

          resolve();
        }

        video.addEventListener("loadeddata", finish);
        video.addEventListener("canplay", finish);
        video.addEventListener("error", finish);

        setTimeout(finish, timeout);
      });
    }

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      return audioCtx;
    }

    function loadBGMBuffer() {
      const ctx = getAudioContext();

      if (bgmBuffer) {
        return Promise.resolve(bgmBuffer);
      }

      if (bgmLoadingPromise) {
        return bgmLoadingPromise;
      }

      bgmLoadingPromise = fetch("./bgm.mp3")
        .then(function (response) {
          if (!response.ok) {
            throw new Error("bgm.mp3 load failed");
          }

          return response.arrayBuffer();
        })
        .then(function (arrayBuffer) {
          return ctx.decodeAudioData(arrayBuffer);
        })
        .then(function (buffer) {
          bgmBuffer = buffer;
          return buffer;
        })
        .catch(function (error) {
          console.error("BGM load failed:", error);
          throw error;
        });

      return bgmLoadingPromise;
    }

    function preloadBGM() {
      loadBGMBuffer().catch(function () {});
    }

    function startBGM() {
      if (bgmStarted) {
        return;
      }

      const ctx = getAudioContext();

      ctx.resume()
        .then(function () {
          return loadBGMBuffer();
        })
        .then(function (buffer) {
          if (bgmStarted) {
            return;
          }

          bgmGain = ctx.createGain();
          bgmGain.gain.value = BGM_VOLUME;
          bgmGain.connect(ctx.destination);

          bgmSource = ctx.createBufferSource();
          bgmSource.buffer = buffer;
          bgmSource.loop = true;
          bgmSource.connect(bgmGain);

          const safeStartTime = Math.min(
            BGM_START_TIME,
            Math.max(0, buffer.duration - 0.1)
          );

          bgmSource.start(0, safeStartTime);
          bgmStarted = true;
        })
        .catch(function (error) {
          console.error("BGM start failed:", error);
        });
    }

    async function playSlot(slot, withSound) {
      const video = videos[slot];

      try {
        video.currentTime = 0;
      } catch (error) {}

      video.loop = true;
      video.muted = !withSound;
      video.volume = 1;
      video.playsInline = true;

      try {
        await video.play();
      } catch (error) {}
    }

    async function switchVideo(direction) {
      if (transitioning || VIDEO_FILES.length === 0) return;

      if (VIDEO_FILES.length === 1) {
        playSlot(activeSlot, true);
        return;
      }

      transitioning = true;

      const outgoing = activeSlot;
      const incoming = activeSlot === 0 ? 1 : 0;

      const nextIndex =
        (currentIndex + direction + VIDEO_FILES.length) % VIDEO_FILES.length;

      setVideoSource(incoming, nextIndex);

      videos[outgoing].muted = true;

      // 立即请求播放，保留用户点击带来的播放权限
      playSlot(incoming, true);

      // 如果视频还没准备好，最多等一小会，减少黑屏概率
      await waitForVideoReady(videos[incoming], INCOMING_WAIT_TIMEOUT);

      cards[outgoing].style.zIndex = 1;
      cards[incoming].style.zIndex = 2;

      const start = performance.now();

      function animate(now) {
        const rawT = Math.min(
          1,
          Math.max(0, (now - start) / TRANSITION_DURATION)
        );

        const t = ease(rawT);

        const outgoingX = -direction * DISTANCE * t;
        const incomingX = direction * DISTANCE * (1 - t);

        const outgoingRot = -direction * ROTATE_MAX * t;
        const incomingRot = direction * ROTATE_MAX * (1 - t);

        const outgoingScale = 1 - SCALE_DROP * t;
        const incomingScale = 1 - SCALE_DROP * (1 - t);

        applyTransform(outgoing, outgoingX, outgoingRot, outgoingScale);
        applyTransform(incoming, incomingX, incomingRot, incomingScale);

        if (rawT < 1) {
          requestAnimationFrame(animate);
          return;
        }

        activeSlot = incoming;
        currentIndex = nextIndex;
        transitioning = false;

        showSlot(incoming);
        hideSlot(outgoing);

        preloadAround(currentIndex);
      }

      requestAnimationFrame(animate);
    }

    function handlePointerAction(endX, endY) {
      if (!firstInteractionDone) {
        firstInteractionDone = true;

        startBGM();

        videos[activeSlot].muted = false;
        videos[activeSlot].volume = 1;
        videos[activeSlot].loop = true;
        videos[activeSlot].play().catch(function () {});

        preloadAround(currentIndex);

        return;
      }

      const dx = endX - pointerDownX;
      const dy = endY - pointerDownY;
      const dragThreshold = 60;

      if (Math.abs(dx) > dragThreshold && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0) {
          switchVideo(1);
        } else {
          switchVideo(-1);
        }

        return;
      }

      if (endX < window.innerWidth / 2) {
        switchVideo(-1);
      } else {
        switchVideo(1);
      }
    }

    app.addEventListener("pointerdown", function (event) {
      pointerIsDown = true;
      pointerDownX = event.clientX;
      pointerDownY = event.clientY;

      try {
        app.setPointerCapture(event.pointerId);
      } catch (error) {}
    });

    app.addEventListener("pointerup", function (event) {
      if (!pointerIsDown) return;

      pointerIsDown = false;
      handlePointerAction(event.clientX, event.clientY);
    });

    app.addEventListener("pointercancel", function () {
      pointerIsDown = false;
    });

    function init() {
      if (VIDEO_FILES.length === 0) return;

      currentIndex = 0;
      activeSlot = 0;

      setVideoSource(0, currentIndex);

      videos[0].muted = true;
      videos[0].loop = true;
      videos[0].playsInline = true;

      videos[1].muted = true;
      videos[1].loop = true;
      videos[1].playsInline = true;

      showSlot(0);
      hideSlot(1);

      videos[0].play().catch(function () {});

      preloadBGM();
      preloadAround(currentIndex);
    }

    init();
  </script>
</body>
</html>
