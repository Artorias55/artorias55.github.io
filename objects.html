            *, *::before, *::after {

            ::selection {

            a {

            }
            .top:hover {
                text-decoration: underline; /* 鼠标悬停时显示下划线 */

            }
            
            html{background-color: var(--color1);}   
            header{
                font-size: 2.5vw;

                font-family:"DOT Bouwhuis TRIAL";
                color: var(--color2);
               
                top: -20px;

            }
            header::after {

                    /* left: 2%; */
                    width: 100%;
                    border-bottom: 1.5px solid var(--color2);
                }
            .name{

            }
         
            .outer{
                width: 96%;
                display: flex;
                justify-items: auto;
                gap:20px 20px;
                margin:16px auto;
                 flex-wrap: wrap;}

            .blur{
                filter: blur(6px);
                pointer-events: none; /* 禁止交互 */
                transition: filter 0.3s;
                transition-timing-function:ease-out;
                z-index: 1;
            }
         
            .date{

                /* visibility: hidden; */

            /* img{

           .card{
                aspect-ratio: 8 / 9.3;  /* 或你自己的比例 */
                background-color: var(--color1);

                border-radius:1px; 
                border: 1.5px solid var(--color2); 
                overflow: hidden;

                flex-basis: calc((100% - 20px * 3 ) / 4);
                position: relative;
            }

            .card img{
                position: absolute;
                top: 50%;
                left: 50%;

                transform: translate(-50%, -50%);

                width: auto;
                height: auto;

                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
                pointer-events: none;
            }
            .date{
                position: absolute;
                bottom: 5px;
                left: 5px;

                z-index: 5;
                font-size: 1vw;
                font-family: "VG5000 Regular";
            }

            .card:hover:not(.selected){
                box-shadow: 0px 0px 3px var(--color2);
                /* border: 1.5px solid rgb(232, 232, 232); */
                cursor: pointer;
                transform: translatey(1px);
                /* top: -0.5px; */
            }
           
             .space{height: calc(3vw - 6px);}
             @media (max-width:900px) {
                .card{
                    flex-basis: calc(50% - 10px);
                }
                .date {font-size: 2vw; }
                .name{padding-top: 5px; 
                }
                header{font-size: 4vw;top: -5px;padding-bottom: 3px;}
                .space{height:calc(5vw - 12px);}
            }
            .selected{
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                    width: 90vw;          /* 优先宽度 70% */
                    max-height: 100vh;     /* 最大高度不超过 90% 屏幕 */
                    height: auto;         /* 高度自适应 */

                    max-width: calc(100vh * 0.72); /* 限制宽度在高不够时自适应缩小 */
                 flex-basis: calc(60% - 4.8px);
                z-index: 2;
                border-radius: 10px;
                font-size:50px;

            }
            .selected .date{font-size: 15px;}
            .selected img.grid-overlay {
                position: absolute;
                /* top: 0; */
                /* left: 0; */
                width: 100%;  /* 和父容器一样大 */
                /* height: 100%; */
                pointer-events: none;  /* 让点击穿透，不影响交互 */
                user-select: none;     /* 防止选中 */
                /* image-rendering: pixelated;  */
                z-index: 10;  /* 保证在原图上方 */
            }
            
         
            /* 只隐藏滚动条，不禁用滚动 */
            .no-scrollbar {
                overflow:auto;
                -ms-overflow-style: none;  /* IE 和 Edge */
                scrollbar-width: none;     /* Firefox */
            }

            .no-scrollbar::-webkit-scrollbar {
                display: none;             /* Chrome, Safari */
            }

            .contact.show{

                display: block;
                margin-left: auto;
            }

      <script>
        const cards = document.querySelectorAll('.card');
        const outer = document.querySelector('.outer');
        const header = document.querySelector('header');

        let selectedCard = null;

        cards.forEach(card => {
            const img = card.querySelector('img');
            const dateDiv = card.querySelector('.date');

            if (img && dateDiv) {
                const src = img.getAttribute('src');
                const fileName = src.match(/([^\/]+)(?=\.\w+$)/)[0];
                dateDiv.textContent = fileName;
            }

            card.onclick = function (e) {
                e.stopPropagation();

                // 如果已有选中的卡片，先清除
                if (selectedCard) {
                    // selectedCard.remove();
                    outer.classList.remove('blur');
                    header.classList.remove('blur');
                    document.body.classList.remove('no-scroll');
                    document.documentElement.classList.remove('no-scroll');
                    document.body.classList.remove('no-scroll');
                    selectedCard = null;
                    return;
                }

                // 克隆当前卡片
                const clone = card.cloneNode(true);
                clone.classList.add('selected');
                   

                // 点击克隆卡片关闭
                clone.onclick = function (e) {
                    e.stopPropagation();
                    clone.remove();
                    outer.classList.remove('blur');
                    header.classList.remove('blur');
                    document.body.classList.remove('no-scroll');
                    document.documentElement.classList.remove('no-scroll');
                    document.body.classList.remove('no-scroll');
                    selectedCard = null;
                };

                document.body.appendChild(clone);
                outer.classList.add('blur');
                header.classList.add('blur');
                document.body.classList.add('no-scroll');
                document.documentElement.classList.add('no-scroll');
                document.body.classList.add('no-scroll');
                selectedCard = clone;
                  // 设置初始样式（透明、缩小）
                clone.style.opacity = '0';
                clone.style.transition = 'opacity 0.2s ease, transform 0.2s ease-out';

                // 下一帧再触发过渡到目标样式（完全显示、正常大小）
                requestAnimationFrame(() => {
                    clone.style.opacity = '1';
                });

                
            };
        });

        // 点击空白区域关闭选中
        document.body.onclick = () => {
            if (selectedCard) {
                selectedCard.remove();
                outer.classList.remove('blur');
                header.classList.remove('blur');
                document.body.classList.remove('no-scroll');
                document.documentElement.classList.remove('no-scroll');
                document.body.classList.remove('no-scroll');
                selectedCard = null;
            }
        };

        // contact按钮
            document.getElementById('contact-toggle').addEventListener('click', function (event) {
                const contactBox = document.getElementById('contact-info');
                contactBox.classList.toggle('show');
                event.stopPropagation(); // 阻止事件冒泡到 body
            });

            document.addEventListener('click', function (event) {
                const contactBox = document.getElementById('contact-info');
                const contactToggle = document.getElementById('contact-toggle');
                 // 如果点击位置不在 contact 区域和按钮内，则关闭
                if (!contactToggle.contains(event.target)) {
                    contactBox.classList.remove('show');
                }
            });
